name: buscaminas_g3

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-buscaminas}
      POSTGRES_USER: ${POSTGRES_USER:-buscaminas}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 20s
    cpus: "1.00"
    mem_limit: 512m
    pids_limit: 100

  api:
    build: .
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-buscaminas}
      POSTGRES_USER: ${POSTGRES_USER:-buscaminas}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Define DJANGO_SECRET_KEY en .env}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-0}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1}
    depends_on:
      db:
        condition: service_healthy
    command:
      - sh
      - -ec
      - |
        python manage.py migrate --noinput
        python manage.py collectstatic --noinput
        exec gunicorn config.wsgi:application \
          --bind 127.0.0.1:8000 --bind 0.0.0.0:5000 \
          --workers 2 --threads 2 --access-logfile -
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/salud/', timeout=4).close()"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 30s
    volumes:
      - static:/app/staticfiles
    networks:
      - frontend
      - backend
    cpus: "1.00"
    mem_limit: 384m
    pids_limit: 64

  web:
    image: caddy:2-alpine
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:8000"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - static:/srv/static:ro
    networks:
      - frontend
    cpus: "0.50"
    mem_limit: 128m
    pids_limit: 48

networks:
  frontend:
  backend:
    internal: true

volumes:
  pgdata:
  static:
