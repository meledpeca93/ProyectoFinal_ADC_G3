  <polygon points="380,172 325,270 430,255 470,212" fill="#0a2036" opacity="0.82"/>
  <polyline points="242,262 380,172 470,212 608,162" fill="none" stroke="url(#cresta-brillo)" stroke-width="2"/>

  <!-- Cordillera frontal -->
  <polygon points="0,295 165,248 295,286 445,218 552,272 688,224 800,276 800,320 0,320" fill="url(#mtn-frente)"/>
  <polygon points="445,218 408,295 512,286 552,272" fill="#061221" opacity="0.85"/>
