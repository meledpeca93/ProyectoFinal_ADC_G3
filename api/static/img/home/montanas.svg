      <stop offset="35%" stop-color="#0ea5e9" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#0a2742" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mtn-fondo" x1="0%" y1="0%" x2="0%" y2="100%">
